<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALCheMy — Augmented Laboratory for Chemistry & Materials</title>
    <meta
      name="description"
      content="A materials-informatics ecosystem built on agentic AI, data engineering and governed MLOps, accelerating the discovery of metal-organic frameworks."
    />
    <!--
      Vista previa al compartir el enlace (Open Graph).

      Sin estas etiquetas, WhatsApp, LinkedIn o Slack no encuentran ninguna
      imagen declarada y se apañan con el icono de pestaña, de 32 o 180 px, que
      estiran hasta el tamaño de la tarjeta. De ahí que la vista previa saliera
      borrosa: no era la calidad del logo, era que no había imagen para ese
      hueco. `og-card.png` la genera `scripts/build_og_image.py`.

      Las direcciones tienen que ser ABSOLUTAS: quien genera la vista previa no
      está navegando por el sitio y no puede resolver una ruta relativa. Por eso
      llevan el dominio escrito, y por eso hay que actualizarlas si cambia.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALCheMy" />
    <meta property="og:url" content="https://alchemyscialab.com/" />
    <meta
      property="og:title"
      content="ALCheMy — Augmented Laboratory for Chemistry &amp; Materials"
    />
    <meta
      property="og:description"
      content="A materials-informatics ecosystem built on agentic AI, data engineering and governed MLOps, accelerating the discovery of metal-organic frameworks."
    />
    <meta property="og:image" content="https://alchemyscialab.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ALCheMy: the crystal-and-orbit mark beside the project name, on a burgundy field."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alchemyscialab.com/og-card.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Marcellus&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica el tema guardado antes del primer pintado, para que no haya
      // un destello de tema claro al recargar en modo oscuro.
      try {
        var t = localStorage.getItem('alchemy-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* navegador con almacenamiento bloqueado: se queda en claro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
