<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALCheMy — Augmented Laboratory for Chemical Materials</title>
    <meta
      name="description"
      content="A materials-informatics ecosystem built on agentic AI, data engineering and governed MLOps, accelerating the discovery of metal-organic frameworks."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Marcellus&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica el tema guardado antes del primer pintado, para que no haya
      // un destello de tema claro al recargar en modo oscuro.
      try {
        var t = localStorage.getItem('alchemy-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* navegador con almacenamiento bloqueado: se queda en claro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
