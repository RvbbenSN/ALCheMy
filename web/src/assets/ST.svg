<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340" width="100%" height="100%">
  <defs>
    <style>
      .stroke-bold { stroke: var(--text-primary, #3B0B15); stroke-width: 3.6px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-medium { stroke: var(--accent-primary, #85253C); stroke-width: 2.2px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-fine { stroke: var(--accent-primary, #85253C); stroke-width: 1.4px; stroke-linecap: round; opacity: 0.6; }
      .stroke-dashed-line { stroke: var(--text-primary, #3B0B15); stroke-width: 2.4px; stroke-linecap: round; stroke-dasharray: 6, 5; fill: none; }
      .stroke-cavity { stroke: var(--accent-primary, #85253C); stroke-width: 1.4px; stroke-dasharray: 4, 3; fill: none; }
      .fill-steel { fill: var(--surface, #FAF6EE); }
      .fill-shade { fill: var(--surface-elevated, #EFE4D3); }
      .fill-teflon { fill: var(--surface, #FFFFFF); }
      .fill-teflon-lip { fill: var(--surface, #F6F1EA); }
      .fill-liquid { fill: var(--surface, #F5EFE4); opacity: 0.85; }
      .accent-gold { fill: var(--accent-secondary, #B8933A); stroke: var(--text-primary, #3B0B15); stroke-width: 1.2px; }
      .line-gold { stroke: var(--accent-secondary, #B8933A); stroke-width: 1.8px; }
    </style>
  </defs>

  <g id="complex-solvothermal-reactor" transform="translate(10, 10)">
    <!-- Tornillo de seguridad / venteo -->
    <rect x="90" y="8" width="20" height="12" rx="2" class="fill-shade stroke-medium" />
    <circle cx="100" cy="14" r="3.2" class="accent-gold" />

    <!-- Tapa superior estriada -->
    <rect x="55" y="20" width="90" height="42" rx="3" class="fill-steel stroke-bold" />
    <line x1="70" y1="22" x2="70" y2="60" class="stroke-medium" />
    <line x1="85" y1="22" x2="85" y2="60" class="stroke-medium" />
    <line x1="100" y1="22" x2="100" y2="60" class="stroke-medium" />
    <line x1="115" y1="22" x2="115" y2="60" class="stroke-medium" />
    <line x1="130" y1="22" x2="130" y2="60" class="stroke-medium" />

    <!-- Interfaz roscada con acento oro -->
    <rect x="51" y="62" width="98" height="7" class="fill-shade stroke-medium" />
    <line x1="53" y1="65.5" x2="147" y2="65.5" class="line-gold" />

    <!-- Cuerpo exterior de acero -->
    <path d="M 35 69 L 165 69 L 165 275 Q 100 300, 35 275 Z" class="fill-steel stroke-bold" />
    <line x1="37" y1="84" x2="163" y2="84" class="stroke-fine" />
    <line x1="37" y1="90" x2="163" y2="90" class="stroke-fine" />
    <line x1="37" y1="258" x2="163" y2="258" class="stroke-fine" />
    <line x1="37" y1="264" x2="163" y2="264" class="stroke-fine" />
    <line x1="43" y1="80" x2="43" y2="270" class="stroke-fine" />

    <!-- Cavidad interior de la camisa metálica -->
    <path d="M 52 82 L 148 82 L 148 244 Q 100 264, 52 244 Z" class="fill-shade stroke-cavity" />

    <!-- Inserto de PTFE (Teflón) -->
    <rect x="54" y="90" width="92" height="7" rx="1.5" class="fill-teflon-lip stroke-medium" />
    <rect x="63" y="97" width="74" height="8" class="fill-shade stroke-fine" />
    <path d="M 59 97 L 141 97 L 141 234 Q 100 252, 59 234 Z" class="fill-teflon stroke-bold" />

    <!-- Nivel de disolvente y menisco -->
    <path d="M 60 170 Q 100 182, 140 170 L 140 234 Q 100 252, 60 234 Z" class="fill-liquid" />
    <path d="M 60 170 Q 100 182, 140 170" class="stroke-dashed-line" />

    <!-- Graduaciones volumétricas -->
    <line x1="61" y1="135" x2="71" y2="135" class="stroke-medium" />
    <line x1="61" y1="170" x2="75" y2="170" class="stroke-medium" />
    <line x1="61" y1="205" x2="71" y2="205" class="stroke-medium" />
  </g>
</svg>
