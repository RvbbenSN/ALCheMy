<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Anillo exterior y recorte circular -->
  <defs>
    <clipPath id="circle-clip-burgundy">
      <circle cx="250" cy="250" r="235" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-burgundy)">
    <!-- Zona de puntos (superior) -->
    <!-- Curva superior (onda media) -->
    <path d="M 0 240 Q 150 180, 260 140 T 500 180 L 500 350 Q 300 230, 0 290 Z" fill="#85253C" opacity="0.85"/>
    
    <!-- Curva inferior / sombra -->
    <path d="M 0 290 Q 200 240, 380 270 T 500 330 L 500 500 L 0 500 Z" fill="#57333B"/>
    
    <!-- Barras del histograma -->
    <g fill="#3B0B15" stroke="#F5EFE4" stroke-width="6">
      <rect x="70"  y="330" width="45" height="170" />
      <rect x="115" y="295" width="45" height="205" />
      <rect x="160" y="285" width="45" height="215" />
      <rect x="205" y="315" width="45" height="185" />
      <rect x="250" y="355" width="45" height="145" />
      <rect x="295" y="385" width="45" height="115" />
      <rect x="340" y="398" width="45" height="102" />
    </g>

    <!-- Nube de puntos decorativa (Borgoña claro / Muted) -->
    <g fill="#85253C" opacity="0.55">
      <circle cx="100" cy="180" r="7"/><circle cx="130" cy="150" r="9"/><circle cx="165" cy="165" r="11"/>
      <circle cx="200" cy="130" r="8"/><circle cx="230" cy="110" r="12"/><circle cx="270" cy="100" r="10"/>
      <circle cx="310" cy="120" r="8"/><circle cx="350" cy="140" r="11"/><circle cx="390" cy="155" r="7"/>
      <circle cx="140" cy="120" r="6"/><circle cx="180" cy="95" r="10"/><circle cx="220" cy="75" r="8"/>
      <circle cx="260" cy="65" r="11"/><circle cx="300" cy="80" r="9"/><circle cx="340" cy="95" r="7"/>
      <circle cx="380" cy="115" r="10"/><circle cx="210" cy="45" r="7"/><circle cx="250" cy="40" r="8"/>
      <circle cx="290" cy="50" r="6"/>
    </g>
  </g>

  <!-- Borde exterior Neo-brutalista -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#85253C" stroke-width="14" />
</svg>
