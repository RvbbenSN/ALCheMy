version: '3.8'

services:
  n8n:
    build:
      context: .
      dockerfile: docker/Dockerfile.n8n
    container_name: alchemy_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - GENERIC_TIMEZONE=Europe/Madrid
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # External-mode task runners (see the "runners" service below): the JS/Python
      # Code nodes execute in that separate sidecar container, not inside n8n itself.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/workflows
      - ./data:/home/node/data
      - ./src:/home/node/src

  runners:
    build:
      context: .
      dockerfile: docker/Dockerfile.runners
    container_name: alchemy_runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      # Same path as the n8n service, so raw_file_path values built by the workflow
      # (folder-watcher lane) resolve to a real file here too - the Python runner
      # opens the file itself, it doesn't receive it through n8n. Read-write: the
      # Webhook/Form lane writes incoming files into data/raw_datalake/ here.
      - ./data:/home/node/data
    depends_on:
      - n8n

  ollama:
    # Motor de embeddings LOCAL. Existe por una razon de privacidad, no de coste:
    # el corpus del RAG incluye cuadernos de laboratorio y protocolos internos, y
    # CLAUDE.md prohibe enviar ese material a un servicio externo. Con Ollama el
    # texto se convierte en vectores dentro de esta maquina y nunca sale de aqui.
    # Modelo elegido: bge-m3 -> 1024 dimensiones, multilingue (ES + EN).
    # OJO: la dimension queda grabada en la columna VECTOR(1024) de rag_chunks.
    # Cambiar de modelo obliga a recrear la tabla y re-indexar TODO el corpus.
    image: ollama/ollama:latest
    container_name: alchemy_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU passthrough (RTX 3060, 12GB VRAM). Requires Docker Desktop's WSL2 backend
    # with GPU support enabled (on by default in recent Docker Desktop when the
    # NVIDIA driver is installed on Windows) - no separate NVIDIA Container Toolkit
    # install needed. Without this the container runs on CPU only (~2min/image
    # instead of ~10-20s), confirmed empirically 2026-08-25.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: alchemy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alchemy_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  n8n_data:
  postgres_data:
  pgadmin_data:
  ollama_data:
